name: RAG Evaluation

on:
  pull_request:
    paths:
      - "src/**"
      - "configs/**"
      - "data/golden/**"
      - ".github/workflows/rag-eval.yml"
  schedule:
    # Nightly full run, including the expensive LLM-judge metrics
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: rag-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Judge metrics are slow + cost money. Only run the full suite nightly,
      # on manual dispatch, or when a PR carries the `full-eval` label.
      RUN_JUDGE: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-eval') }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Need main's baseline metrics for the delta comparison
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.lock

      # The index is deterministic given the corpus + retrieval config, so
      # key the cache on both. A config change correctly forces a rebuild.
      - name: Cache vector index
        id: index-cache
        uses: actions/cache@v4
        with:
          path: .index/
          key: index-${{ hashFiles('configs/retrieval.yaml', 'data/corpus/manifest.json') }}

      - name: Build index
        if: steps.index-cache.outputs.cache-hit != 'true'
        run: python -m src.ingest --config configs/retrieval.yaml --out .index/

      - name: Run retrieval evaluation (deterministic, always)
        run: |
          python -m src.evaluate \
            --suite retrieval \
            --dataset data/golden/questions.jsonl \
            --config configs/retrieval.yaml \
            --out results/current.json

      - name: Run judge evaluation (RAGAS)
        if: env.RUN_JUDGE == 'true'
        run: |
          python -m src.evaluate \
            --suite judge \
            --dataset data/golden/questions.jsonl \
            --config configs/retrieval.yaml \
            --runs 3 \
            --merge-into results/current.json

      - name: Fetch baseline from main
        run: |
          git show origin/${{ github.base_ref || 'main' }}:results/baseline.json > results/baseline.json \
            || echo '{}' > results/baseline.json

      - name: Compare against baseline
        id: compare
        continue-on-error: true
        run: |
          python scripts/compare.py \
            --current results/current.json \
            --baseline results/baseline.json \
            --thresholds configs/eval_config.yaml \
            --markdown results/report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('results/report.md', 'utf8');
            const marker = '<!-- rag-eval-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const payload = marker + '\n' + body;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: payload,
              });
            }

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: results/

      # compare.py exits non-zero on a threshold breach; this step surfaces it
      # after the comment has been posted, so a failing PR still gets its table.
      - name: Enforce gate
        if: steps.compare.outcome == 'failure'
        run: exit 1
